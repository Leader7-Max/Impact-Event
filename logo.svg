<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img" aria-label="Impact Event">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.55" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#ff2e4d"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#2979ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a1a"/>
      <stop offset="0.5" stop-color="#ff2e4d"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icône : anneau + égaliseur -->
  <g filter="url(#glow)">
    <circle cx="90" cy="110" r="70" fill="none" stroke="url(#ring)" stroke-width="6"/>
    <rect x="52"  y="95"  width="9" height="30" rx="4.5" fill="#ff6a1a"/>
    <rect x="69"  y="80"  width="9" height="60" rx="4.5" fill="#ff2e4d"/>
    <rect x="86"  y="65"  width="9" height="90" rx="4.5" fill="#00e5ff"/>
    <rect x="103" y="80"  width="9" height="60" rx="4.5" fill="#2979ff"/>
    <rect x="120" y="93"  width="9" height="34" rx="4.5" fill="#00e5ff"/>
  </g>

  <!-- Texte -->
  <g filter="url(#glow)" font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="800">
    <text x="190" y="102" font-size="58" letter-spacing="5" fill="url(#og)">IMPACT</text>
    <text x="190" y="158" font-size="58" letter-spacing="5" fill="url(#cy)">EVENT</text>
  </g>

  <text x="192" y="190" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="3.5" fill="#9a9ab0">DJ • MC • SONO • LUMIÈRES</text>
</svg>
